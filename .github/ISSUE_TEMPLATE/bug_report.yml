name: Bug report
description: Report a bug or unexpected behavior in SmartCal
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly describe what happened and what you expected to happen.
      placeholder: What went wrong and what should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal code snippet or mathematical expression that reproduces the issue.
      placeholder: |
        import { SmartCal } from "smartcal";

        const engine = new SmartCal();
        engine.evaluate("2 + 2");
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: SmartCal version and runtime (for example Node 20, Bun 1.2, browser).
      placeholder: SmartCal 1.1.1, Bun 1.2
    validations:
      required: false
